functional:
  - Пользователь может зарегистрироваться в приложении.
  - Зарегистрированный пользователь может авторизоваться в приложении.
  - Пользователь может создать новую игру.
  - При создании игры пользователь может выбрать тип соперника — другого пользователя, друга или бота.
  - При создании игры пользователь может выбрать уровень сложности задачи.
  - Пользователь может выбрать конкретную задачу или запустить игру со случайно выбранной задачей.
  - Участники игры могут решать одну и ту же задачу с помощью редактора кода.
  - Пользователь может выбрать язык программирования для решения задачи.
  - Приложение проверяет отправленный программный код и определяет результат решения.
  - После завершения игры приложение отображает её результат.
  - Зарегистрированные пользователи могут общаться в игровом чате.
  - Пользователь может просматривать рейтинг игроков.
  - Пользователь может просматривать завершённые игры.

non-functional:
  - Приложение должно корректно отображаться в поддерживаемых браузерах.
  - Приложение должно обеспечивать защиту пользовательских данных.
  - Игровой интерфейс должен корректно отображать изменения состояния игры для её участников.

implicit:
  - Обязательные поля форм должны быть проверены перед отправкой данных.
  - При возникновении ошибки приложение должно отображать понятное сообщение пользователю.
  - Пользователь не должен иметь возможности выполнять действия, недоступные ему из-за отсутствия авторизации или необходимых прав.
  - После завершения игры результат должен быть доступен участникам для просмотра.
  - Во время игры пользователь должен понимать текущее состояние игрового процесса.
