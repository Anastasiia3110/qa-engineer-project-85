---
- summary: |
    Успешная регистрация пользователя с корректными данными.
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться в приложении, указав корректные регистрационные данные.
  prerequisites: |
    Открыта страница регистрации. Пользователь имеет доступ к указанному почтовому ящику.
  test-data: |
    Тестовые данные
    Прозвище = Pororo123
    Электронная почта = testik_pochta@mail.ru
    Пароль = test123000
    Подтвердите пароль = test123000
  steps:
    - Вводим прозвище.
    - Вводим электронную почту.
    - Вводим пароль.
    - Подтверждаем пароль.
    - Нажимаем кнопку "Зарегистрироваться".
  expected-result: |
    Приложение отображает сообщение об успешной отправке письма для подтверждения электронной почты. 
    Пользователю предлагается подтвердить адрес электронной почты перед входом в приложение.

- summary: |
    Успешная авторизация пользователя в приложении.
  requirement: |
    Зарегистрированный пользователь может авторизоваться в приложении.
  prerequisites: |
    Пользователь зарегистрирован в приложении.
    Адрес электронной почты подтвержден.
    Открыта страница входа.
  test-data: |
    Тестовые данные
    Электронная почта = testik_pochta@mail.ru
    Пароль = test123000
  steps:
    - Вводим электронную почту.
    - Вводим пароль.
    - Нажимаем кнопку "Войти".
  expected-result: |
    Пользователь успешно авторизован и попадает на главную страницу приложения.

- summary: |
    Создание новой игры с ботом.
  requirement: |
    Авторизованный пользователь может создать новую игру с ботом.
  prerequisites: |
    Пользователь авторизован. Открыта главная страница приложения.
  test-data: |
    Тестовые данные
    Уровень сложности = начальный
    Соперник = бот
    Контроль времени = 8 мин
    Задача = случайная задача
  steps:
    - Нажать на кнопку "Создать битву".
    - Выбрать уровень сложности "Начальный".
    - Выбрать соперника "Бот".
    - Установить контроль времени 8 минут.
    - Оставить выбор случайной задачи.
    - Нажать кнопку "Создать битву".
  expected-result: |
    Создаётся новая игра. Открывается игровая комната, в которой отображается выбранная задача и бот в качестве соперника.

- summary: |
    Создание новой игры со случайным соперником.
  requirement: |
    Авторизованный пользователь может создать новую игру со случайным соперником.
  prerequisites: |
    Пользователь авторизован. Открыта главная страница приложения.
  test-data: |
    Тестовые данные
    Уровень сложности = легкий
    Соперник = случайный соперник
    Контроль времени = 15 мин
    Задача = balance
  steps:
    - Нажать на кнопку "Создать битву".
    - Выбрать уровень сложности "Легкий".
    - Выбрать соперника "Случайный соперник".
    - Установить контроль времени 15 минут.
    - Выбрать задачу balance в выпадающем списке.
    - Нажать кнопку "Создать битву".
  expected-result: |
    Отображается сообщение «Битва создана». Отображается ссылка на созданную игру и QR-код. Статус игры — «Ожидание соперника».

- summary: |
    Отправка приглашения другу для создания игры.
  requirement: |
    Авторизованный пользователь может создать новую игру с другом.
  prerequisites: |
    Пользователь авторизован. Открыта главная страница приложения.
    В приложении доступен пользователь, которому можно отправить приглашение.
  test-data: |
    Тестовые данные
    Уровень сложности = Лёгкий
    Соперник = С другом
    Имя соперника = DmBelkin
    Контроль времени = 8 минут
    Задача = Случайная задача
  steps:
    - Нажать на кнопку "Создать битву".
    - Выбрать уровень сложности "Лёгкий".
    - Выбрать соперника "С другом".
    - Выбрать пользователя DmBelkin из списка.
    - Установить контроль времени 8 минут.
    - Оставить выбор случайной задачи.
    - Нажать кнопку «Отправить вызов».
  expected-result: |
    Пользователь возвращается на главную страницу приложения.
    Отображается уведомление об отправке приглашения выбранному пользователю.

- summary: |
    Успешное создание игры с ботом при выборе уровня сложности Medium.
  requirement: |
    При создании игры пользователь может выбрать уровень сложности задачи.
  prerequisites: |
    Пользователь авторизован в приложении.
    Открыта главная страница приложения.
  test-data: |
    Тестовые данные
    Соперник = Bot
    Уровень сложности = Medium
    Время игры = 8 минут
    Задача = случайная
  steps:
    - Нажимаем кнопку "Создать битву".
    - Выбираем соперника "Бот".
    - Выбираем уровень сложности "Medium".
    - Оставляем время игры 8 минут.
    - Оставляем случайный выбор задачи.
    - Нажимаем кнопку "Создать битву".
  expected-result: |
    Игра успешно создаётся с ботом.
    В игровой комнате отображается задача, соответствующая выбранному уровню сложности Medium.

