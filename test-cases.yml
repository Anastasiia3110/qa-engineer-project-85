- summary: |
    Совместное решение одной задачи двумя участниками с помощью редактора кода.
  requirement: |
    Участники игры могут решать одну и ту же задачу с помощью редактора кода.
  prerequisites: |
    Зарегистрированы два аккаунта.
    Пользователь авторизован в первом аккаунте.
    Второй пользователь авторизован во втором аккаунте.
  test-data: |
    Тестовые данные
    Соперник = друг
    Уровень сложности = Easy
    Время игры = 8 минут
    Задача = digits_validator
  steps:
    - Нажать кнопку "Создать битву".
    - Выбрать соперника "с другом".
    - Выбрать уровень сложности, время и задачу.
    - Отправить приглашение второму пользователю.
    - Принять приглашение со второго аккаунта.
    - Проверить отображение задачи в обоих аккаунтах.
    - Проверить наличие редактора кода у обоих участников.
    - Ввести тестовый код в редакторе каждого участника.
  expected-result: |
    Оба участника подключаются к одной игровой комнате.
    У обоих отображается одна и та же задача. У обоих доступен редактор кода.
    Каждый участник может вводить код в своём редакторе.

- summary: |
    Успешный выбор языка программирования для решения задачи.
  requirement: |
    Пользователь может выбрать язык программирования для решения задачи.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана игра, и пользователь находится в игровой комнате.
    Открыта задача с доступным редактором кода.
  test-data: |
    Тестовые данные
    Язык программирования = Python
  steps:
    - Найти выпадающий список с текущим языком программирования над редактором кода.
    - Нажать на выпадающий список.
    - Выбрать Python.
    - Проверить отображение выбранного языка над редактором.
    - Проверить отображение редактора кода с синтаксисом Python.
    - Ввести небольшой фрагмент кода на Python.
  expected-result: |
    В выпадающем списке отображается выбранный язык Python. Редактор кода переключается на Python.
    Пользователь может вводить код на выбранном языке программирования.

- summary: |
    Успешное повторное переключение языка программирования с Python на JavaScript.
  requirement: |
    Пользователь может выбрать язык программирования для решения задачи.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана игра, и пользователь находится в игровой комнате.
    В редакторе кода выбран язык Python.
  test-data: |
    Тестовые данные
    Текущий язык программирования = Python
    Новый язык программирования = JavaScript
  steps:
    - Нажать на выпадающий список с текущим языком программирования.
    - Выбрать JavaScript.
    - Проверить отображение выбранного языка над редактором.
    - Проверить изменение синтаксиса редактора кода.
    - Ввести небольшой фрагмент кода на JavaScript.
  expected-result: |
    В выпадающем списке отображается JavaScript. Редактор кода переключается на JavaScript.
    Пользователь может вводить код на выбранном языке программирования.

- summary: |
    Проверка неправильного решения задачи.
  requirement: |
    Приложение проверяет отправленный программный код и определяет результат решения.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана игра, и пользователь находится в игровой комнате.
    Открыта задача и доступен редактор кода.
  test-data: |
    Тестовые данные
    Программный код = решение с ошибкой, не проходящее все тесты.
  steps:
    - Ввести в редактор кода неправильное решение задачи.
    - Нажать кнопку «Запустить».
    - Проверить результат выполнения тестов.
  expected-result: |
    Приложение выполняет проверку программного кода. Один или несколько тестов не проходят проверку.
    Пользователь видит информацию о непройденных тестах. Решение не засчитывается как успешное.

- summary: |
    Проверка успешного решения задачи.
  requirement: |
    Приложение проверяет отправленный программный код и определяет результат решения.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана игра, и пользователь находится в игровой комнате.
    Открыта задача и доступен редактор кода.
  test-data: |
    Тестовые данные
    Программный код = корректное решение задачи, проходящее все тесты.
  steps:
    - Ввести в редактор кода правильное решение задачи.
    - Нажать кнопку «Запустить».
    - Проверить результат выполнения тестов.
  expected-result: |
    Приложение выполняет проверку программного кода. Все тесты пройдены успешно.
    Приложение засчитывает решение. Отображается сообщение об успешном завершении битвы.

- summary: |
    Отображение результата игры после победы пользователя.
  requirement: |
    После завершения игры приложение отображает её результат.
  prerequisites: |
    Пользователь авторизован в приложении. Создана игра, и пользователь находится в игровой комнате.
    Соперник подключился к игре.
  test-data: |
    Тестовые данные
    Результат игры = победа пользователя
  steps:
    - Решить задачу правильно раньше соперника.
    - Дождаться завершения игры.
    - Проверить отображение результата игры.
  expected-result: |
    Приложение отображает сообщение о победе пользователя.
    Появляется окно «Баттл официально затащен!». В игровой комнате отображается статус «Вы победили!».

- summary: |
    Отображение результата игры после поражения пользователя.
  requirement: |
    После завершения игры приложение отображает её результат.
  prerequisites: |
    Пользователь авторизован в приложении. Создана игра, и пользователь находится в игровой комнате.
    Соперник подключился к игре.
  test-data: |
    Тестовые данные
    Результат игры = поражение пользователя
  steps:
    - Дождаться, пока соперник правильно решит задачу раньше нас.
    - Дождаться завершения игры.
    - Проверить отображение результата игры.
  expected-result: |
    Приложение отображает сообщение о поражении пользователя.
    Появляется окно «Ты заслуживаешь победы, продолжай!». В игровой комнате отображается статус «Вы проиграли».

- summary: |
    Успешная отправка сообщений между участниками игровой битвы.
  requirement: |
    Зарегистрированные пользователи могут общаться в игровом чате.
  prerequisites: |
    Зарегистрированы два аккаунта. Оба пользователя авторизованы в приложении.
    Создана игра с другом. Второй пользователь подключился к игровой комнате.
  test-data: |
    Тестовые данные
    Сообщение первого пользователя = Привет
    Сообщение второго пользователя = Привет
  steps:
    - Открыть игровой чат в комнате созданной битвы.
    - Ввести сообщение «привет» от имени первого пользователя.
    - Отправить сообщение.
    - Проверить отображение сообщения в игровом чате.
    - Ввести ответное сообщение «Привет» от имени второго пользователя.
    - Отправить ответное сообщение.
    - Проверить отображение ответа в игровом чате первого пользователя.
  expected-result: |
    Первое сообщение успешно отправляется и отображается в игровом чате.
    Второй участник видит сообщение первого пользователя. Второй участник может отправить ответное сообщение.
    Ответное сообщение отображается в игровом чате. Оба сообщения отображаются с именами соответствующих отправителей.

- summary: |
    Просмотр рейтинга игроков на главной странице приложения.
  requirement: |
    Пользователь может просматривать рейтинг игроков.
  prerequisites: |
    Пользователь авторизован в приложении.
    Открыта главная страница приложения.
  test-data: |
    Тестовые данные
    Раздел = Рейтинг
    Период рейтинга = Всё время
  steps:
    - Найти блок «Рейтинг» на главной странице.
    - Проверить отображение списка игроков.
    - Проверить отображение позиций игроков и количества набранных очков.
    - Нажать на следующую страницу рейтинга.
    - Проверить отображение списка игроков на следующей странице.
  expected-result: |
    На главной странице отображается блок «Рейтинг». В рейтинге отображается список игроков.
    Для игроков указаны позиции и количество набранных очков. При переходе на следующую страницу отображается другая часть рейтинга.
    Пользователь может просматривать рейтинг игроков.

- summary: |
    Просмотр списка завершённых игр пользователя.
  requirement: |
    Пользователь может просматривать завершённые игры.
  prerequisites: |
    Пользователь зарегистрирован и авторизован в приложении.
    У пользователя есть завершённые игры.
    Открыт профиль пользователя.
  test-data: |
    Тестовые данные
    Раздел профиля = Завершённые игры
  steps:
    - Открыть профиль пользователя.
    - Перейти во вкладку «Завершённые игры».
    - Проверить отображение списка завершённых игр.
    - Проверить отображение уровня сложности, участников, победителя, даты и времени игры.
    - Нажать кнопку «Открыть» напротив одной из завершённых игр.
    - Проверить открытие выбранной игры.
  expected-result: |
    Приложение отображает список завершённых игр пользователя.
    Для каждой игры отображается информация об уровне сложности, участниках, победителе, дате и времени завершения.
    При нажатии кнопки «Открыть» отображается выбранная завершённая игра.
    Пользователь может просмотреть условие задачи, код участников и итоговые статусы игроков. 

- summary: |
    Проверка корректного отображения приложения в браузерах Chrome и Safari.
  requirement: |
    Приложение должно корректно отображаться в поддерживаемых браузерах.
  prerequisites: |
    Установлены браузеры Google Chrome и Safari.
    Пользователь имеет доступ к приложению Codebattle.
  test-data: |
    Тестовые данные
    Браузеры:
    - Google Chrome 156.0.8078.48 (arm64)
    - Safari 27
  steps:
    - Открыть приложение Codebattle в Google Chrome.
    - Авторизоваться в приложении.
    - Проверить корректность отображения главной страницы.
    - Проверить отображение основных элементов интерфейса.
    - Открыть приложение Codebattle в Safari.
    - Авторизоваться в приложении.
    - Проверить корректность отображения главной страницы.
    - Проверить отображение основных элементов интерфейса.
  expected-result: |
    Приложение корректно отображается в обоих браузерах.
    Основные элементы интерфейса отображаются без визуальных дефектов. Кнопки, меню и навигация доступны для использования.

- summary: |
    Проверка безопасности сайта.
  requirement: |
    Приложение должно обеспечивать защиту пользовательских данных.
  prerequisites:
    Открыта страница приложения.
  test-data: |
    Не требуются
  steps:
    - Открыть приложение.
    - Проверить, что адрес сайта начинается с "https://".
  expected-result: |
    Адрес сайта начинается с "https://", соединение является защищенным.

- summary: |
    Проверка защищённой передачи данных при авторизации пользователя.
  requirement: |
    Приложение должно обеспечивать защиту пользовательских данных.
  prerequisites: |
    Открыта страница авторизации приложения.
    Открыты DevTools, выбрана вкладка Network.
  test-data: |
    Тестовые данные
    Зарегистрированный аккаунт пользователя: электронная почта и пароль.
  steps:
    - Очистить список запросов во вкладке Network.
    - Ввести электронную почту и пароль.
    - Нажать кнопку «Войти».
    - Найти запрос session.
    - Открыть вкладку Headers и проверить Request URL.
    - Открыть вкладку Payload и проверить расположение передаваемых данных.
  expected-result: |
    Запрос авторизации отправляется методом POST по защищённому протоколу HTTPS.
    Электронная почта и пароль передаются в теле запроса, а не в URL. Сервер успешно обрабатывает запрос.
    Пользователь успешно авторизуется в приложении.

- summary: |
    Проверка обновления состояния игры для обоих участников при сдаче одного из игроков.
  requirement: |
    Игровой интерфейс должен корректно отображать изменения состояния игры для её участников.
  prerequisites: |
    Зарегистрированы два пользователя. Оба пользователя авторизованы в приложении.
    Создана игра, к которой присоединились оба участника.
    Открыта игровая комната у обоих участников.
  test-data: |
    Тестовые данные
    Два зарегистрированных пользователя.
  steps:
    - От имени первого участника нажать кнопку «Сдаться».
    - Проверить состояние игрового интерфейса первого участника.
    - Проверить состояние игрового интерфейса второго участника.
  expected-result: |
    Игра завершается.
    В интерфейсе первого участника отображается статус «Вы сдались».
    В интерфейсе второго участника отображается статус «Победа».
    Оба участника видят актуальное состояние завершённой игры.

- summary: |
    Проверка валидации пустых обязательных полей формы авторизации.
  requirement: |
    Обязательные поля форм должны быть проверены перед отправкой данных.
  prerequisites: |
    Открыта страница авторизации Codebattle.
  test-data: |
    Тестовые данные
    Email = пустое поле
    Password = пустое поле
  steps:
    - Оставить поля Email и Password пустыми.
    - Нажать кнопку «Sign In».
  expected-result: |
    Авторизация не выполняется.
    Под полями Email и Password отображаются сообщения «Email required» и «Password required».

- summary: |
    Проверка валидации некорректного адреса электронной почты.
  requirement: |
    Обязательные поля форм должны быть проверены перед отправкой данных.
  prerequisites: |
    Открыта страница авторизации Codebattle.
  test-data: |
    Тестовые данные
    Email = testik
    Password = test123000
  steps:
    - Ввести некорректный адрес электронной почты.
    - Ввести пароль.
    - Проверить уведомление об ошибке.
  expected-result: |
    Приложение отображает сообщение об ошибке «Can't contain special symbols».
    Авторизация с некорректным адресом электронной почты не выполняется.

- summary: |
    Проверка отображения сообщения при авторизации с неверным паролем.
  requirement: |
    При возникновении ошибки приложение должно отображать понятное сообщение пользователю.
  prerequisites: |
    Пользователь зарегистрирован в приложении.
    Открыта страница авторизации.
  test-data: |
    Тестовые данные
    Email = testik_pochta@mail.ru
    Пароль = неверный пароль
  steps:
    - Ввести зарегистрированный Email.
    - Ввести неверный пароль.
    - Нажать кнопку «Sign In».
  expected-result: |
    Приложение отображает сообщение «Invalid email or password».
    Авторизация не выполняется.

- summary: |
    Отображение сообщения об ошибке при регистрации с уже существующим Email.
  requirement: |
    При возникновении ошибки приложение должно отображать понятное сообщение пользователю.
  prerequisites: |
    Открыта страница регистрации.
    В приложении уже зарегистрирован пользователь с указанным адресом электронной почты.
  test-data: |
    Тестовые данные
    Прозвище = другое тестовое прозвище
    Электронная почта = Email существующего пользователя
    Пароль = test123000
    Подтверждение пароля = test123000
  steps:
    - Ввести новое прозвище.
    - Ввести Email уже зарегистрированного пользователя.
    - Ввести пароль.
    - Повторно ввести пароль для подтверждения.
    - Нажать кнопку регистрации.
  expected-result: |
    Приложение отображает понятное сообщение о том, что указанный Email уже зарегистрирован.
    Новая регистрация не выполняется.

- summary: |
    Отображение сообщения об ошибке при создании игры при отсутствии интернет-соединения.
  requirement: |
    При возникновении ошибки приложение должно отображать понятное сообщение пользователю.
  prerequisites: |
    Пользователь авторизован в приложении.
    Открыта страница создания игры.
  test-data: |
    Тестовые данные
    Тип соперника = Бот
    Уровень сложности = Elementary
    Время игры = 8 минут
    Интернет-соединение = Отключено через DevTools
  steps:
    - Открыть DevTools и переходим во вкладку Network.
    - Выбрать режим Offline.
    - Заполнить форму создания игры.
    - Нажать кнопку «Создать битву».
  expected-result: |
    Приложение отображает понятное сообщение об отсутствии интернет-соединения.
    Пользователь понимает, почему игра не была создана.

- summary: |
    Отображение сообщения об ошибке при отправке решения после потери интернет-соединения.
  requirement: |
    При возникновении ошибки приложение должно отображать понятное сообщение пользователю.
  prerequisites: |
    Пользователь авторизован.
    Создана и запущена игра.
    Открыта игровая комната.
  test-data: |
    Тестовые данные
    Интернет-соединение = Отключено через DevTools
    Язык программирования = Python
  steps:
    - Открыть DevTools и перейти во вкладку Network.
    - Выбрать режим Offline
    - Ввести решение задачи в редактор кода
    - Нажать кнопку «Запустить»
  expected-result: |
    Приложение отображает сообщение: «Решение не дошло до сервера. Проверь подключение и запусти ещё раз».
    Пользователь получает понятную информацию о причине ошибки.

- summary: |
    Попытка создать обычную битву без авторизации.
  requirement: |
    Пользователь не должен иметь возможности выполнять действия, недоступные ему из-за отсутствия авторизации или необходимых прав.
  prerequisites: |
    Пользователь не авторизован в приложении.
  test-data: |
    Тестовые данные
    Не требуются
  steps:
    - Открыть приложение.
    - Нажать «Play your first battle».
    - Попытаться выбрать случайного соперника или пригласить друга.
  expected-result: |
    Приложение не позволяет создать обычную битву без авторизации и предлагает войти в аккаунт или зарегистрироваться.

- summary: |
    Просмотр результата завершённой игры через историю.
  requirement: |
    После завершения игры результат должен быть доступен участникам для просмотра.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана и завершена игра с ботом.
  test-data: |
    Тестовые данные
    Не требуются
  steps:
    - Завершить игру (например, сдаться).
    - Проверить отображение результата завершённой игры.
    - Нажать кнопку «Открыть историю».
    - Проверить отображение завершённой игры в режиме истории.
  expected-result: |
    После завершения игры приложение отображает её результат.
    В истории доступна завершённая игра, в которой можно просмотреть результат, задачу и код участников.

- summary: |
    Отображение текущего состояния игрового процесса.
  requirement: |
    Во время игры пользователь должен понимать текущее состояние игрового процесса.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана и запущена игра с ботом.
  test-data: |
    Тестовые данные
    Не требуются
  steps:
    - Проверить отображение таймера обратного отсчёта.
    - Проверить отображение участников игры и их статусов.
    - Ввести решение и нажать кнопку «Запустить».
    - Проверить отображение процесса отправки и проверки решения.
    - Дождаться завершения игры и проверить отображение итоговых статусов участников.
  expected-result: |
    Во время игры приложение отображает таймер и текущие статусы участников.
    При отправке решения пользователь видит, что решение обрабатывается.
    После завершения игры отображаются итоговые статусы участников.
