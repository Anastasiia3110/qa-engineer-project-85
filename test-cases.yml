- summary: |
    Совместное решение одной задачи двумя участниками с помощью редактора кода.
  requirement: |
    Участники игры могут решать одну и ту же задачу с помощью редактора кода.
  prerequisites: |
    Зарегистрированы два аккаунта.
    Пользователь авторизован в первом аккаунте.
    Второй пользователь авторизован во втором аккаунте.
  test-data: |
    Тестовые данные
    Соперник = друг
    Уровень сложности = Easy
    Время игры = 8 минут
    Задача = digits_validator
  steps:
    - Нажимаем кнопку "Создать битву".
    - Выбирает соперника "с другом".
    - Выбираем уровень сложности, время и задачу.
    - Отправляем приглашение второму пользователю.
    - Принимаем приглашение со второго аккаунта.
    - Проверяем отображение задачи в обоих аккаунтах.
    - Проверяем наличие редактора кода у обоих участников.
    - Вводим тестовый код в редакторе каждого участника.
  expected-result: |
    Оба участника подключаются к одной игровой комнате.
    У обоих отображается одна и та же задача. У обоих доступен редактор кода.
    Каждый участник может вводить код в своём редакторе.

- summary: |
    Успешный выбор языка программирования для решения задачи.
  requirement: |
    Пользователь может выбрать язык программирования для решения задачи.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана игра, и пользователь находится в игровой комнате.
    Открыта задача с доступным редактором кода.
  test-data: |
    Тестовые данные
    Язык программирования = Python
  steps:
    - Находим выпадающий список с текущим языком программирования над редактором кода.
    - Нажимаем на выпадающий список.
    - Выбираем Python.
    - Проверяем отображение выбранного языка над редактором.
    - Проверяем отображение редактора кода с синтаксисом Python.
    - Вводим небольшой фрагмент кода на Python.
  expected-result: |
    В выпадающем списке отображается выбранный язык Python. Редактор кода переключается на Python.
    Пользователь может вводить код на выбранном языке программирования.

- summary: |
    Успешное повторное переключение языка программирования с Python на JavaScript.
  requirement: |
    Пользователь может выбрать язык программирования для решения задачи.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана игра, и пользователь находится в игровой комнате.
    В редакторе кода выбран язык Python.
  test-data: |
    Тестовые данные
    Текущий язык программирования = Python
    Новый язык программирования = JavaScript
  steps:
    - Нажимаем на выпадающий список с текущим языком программирования.
    - Выбираем JavaScript.
    - Проверяем отображение выбранного языка над редактором.
    - Проверяем изменение синтаксиса редактора кода.
    - Вводим небольшой фрагмент кода на JavaScript.
  expected-result: |
    В выпадающем списке отображается JavaScript. Редактор кода переключается на JavaScript.
    Пользователь может вводить код на выбранном языке программирования.

- summary: |
    Проверка неправильного решения задачи.
  requirement: |
    Приложение проверяет отправленный программный код и определяет результат решения.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана игра, и пользователь находится в игровой комнате.
    Открыта задача и доступен редактор кода.
  test-data: |
    Тестовые данные
    Программный код = решение с ошибкой, не проходящее все тесты.
  steps:
    - Вводим в редактор кода неправильное решение задачи.
    - Нажимаем кнопку «Запустить».
    - Проверяем результат выполнения тестов.
  expected-result: |
    Приложение выполняет проверку программного кода. Один или несколько тестов не проходят проверку.
    Пользователь видит информацию о непройденных тестах. Решение не засчитывается как успешное.

- summary: |
    Проверка успешного решения задачи.
  requirement: |
    Приложение проверяет отправленный программный код и определяет результат решения.
  prerequisites: |
    Пользователь авторизован в приложении.
    Создана игра, и пользователь находится в игровой комнате.
    Открыта задача и доступен редактор кода.
  test-data: |
    Тестовые данные
    Программный код = корректное решение задачи, проходящее все тесты.
  steps:
    - Вводим в редактор кода правильное решение задачи.
    - Нажимаем кнопку «Запустить».
    - Проверяем результат выполнения тестов.
  expected-result: |
    Приложение выполняет проверку программного кода. Все тесты пройдены успешно.
    Приложение засчитывает решение. Отображается сообщение об успешном завершении битвы.

- summary: |
    Отображение результата игры после победы пользователя.
  requirement: |
    После завершения игры приложение отображает её результат.
  prerequisites: |
    Пользователь авторизован в приложении. Создана игра, и пользователь находится в игровой комнате.
    Соперник подключился к игре.
  test-data: |
    Тестовые данные
    Результат игры = победа пользователя
  steps:
    - Решаем задачу правильно раньше соперника.
    - Дожидаемся завершения игры.
    - Проверяем отображение результата игры.
  expected-result: |
    Приложение отображает сообщение о победе пользователя.
    Появляется окно «Баттл официально затащен!». В игровой комнате отображается статус «Вы победили!».

- summary: |
    Отображение результата игры после поражения пользователя.
  requirement: |
    После завершения игры приложение отображает её результат.
  prerequisites: |
    Пользователь авторизован в приложении. Создана игра, и пользователь находится в игровой комнате.
    Соперник подключился к игре.
  test-data: |
    Тестовые данные
    Результат игры = поражение пользователя
  steps:
    - Дожидаемся, пока соперник правильно решит задачу раньше нас.
    - Дожидаемся завершения игры.
    - Проверяем отображение результата игры.
  expected-result: |
    Приложение отображает сообщение о поражении пользователя.
    Появляется окно «Ты заслуживаешь победы, продолжай!». В игровой комнате отображается статус «Вы проиграли».
